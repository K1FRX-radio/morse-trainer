name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      verified_sha: ${{ steps.checkout-sha.outputs.sha }}
    steps:
      - name: Check out event ref
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out dispatched PR head
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Capture the checkout being validated
        id: checkout-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  report-pr-state:
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Record green CI and notify only when review also approves this head
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          OWNER_LOGIN: frivolas
        with:
          github-token: ${{ github.token }}
          script: |
            const issue_number = Number(process.env.PR_NUMBER);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ownerLogin = process.env.OWNER_LOGIN;
            const headSha = process.env.VERIFIED_SHA;
            const isCurrentHead = async () => {
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: issue_number,
              });
              return Boolean(headSha) && pr.head.sha === headSha &&
                pr.head.repo?.full_name === `${owner}/${repo}` &&
                pr.state === "open" && !pr.draft;
            };
            if (!(await isCurrentHead())) return;

            const readAutomationComments = async () => (
              await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 },
              )
            ).filter((comment) =>
              comment.user?.login === "github-actions[bot]" &&
              comment.user?.type === "Bot",
            );
            let comments = await readAutomationComments();
            const greenMarker = `<!-- agent-ci:green head=${headSha} -->`;
            const readyMarker = `<!-- owner-notify:merge-ready head=${headSha} -->`;
            const greenBody = `${greenMarker}\nAutomated CI is green for \`${headSha.slice(0, 8)}\`.`;
            const readyBody = `${readyMarker}\n@${ownerLogin}, this exact PR head is supervisor-approved and CI-green. It is ready for your merge decision.`;
            const parseReview = (comment) => {
              const match = /^<!-- agent-supervisor:(approve|changes_requested|owner_decision) head=([0-9a-f]{40}) -->\n## Automated supervisor review\n\n\*\*Verdict:\*\* `\1`\n\n/.exec(comment.body ?? "");
              return match ? { verdict: match[1], headSha: match[2] } : undefined;
            };

            if (!(await isCurrentHead())) return;
            if (!comments.some((comment) => comment.body === greenBody)) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: greenBody,
              });
            }

            comments = await readAutomationComments();
            const latestReview = comments.map(parseReview)
              .filter((review) => review?.headSha === headSha).at(-1);
            const approved = latestReview?.verdict === "approve";
            const alreadyNotified = comments.some((comment) =>
              comment.body === readyBody,
            );
            if (!approved) return;

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: "owner:merge-ready",
                color: "5319e7",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            if (!(await isCurrentHead())) return;
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: ["owner:merge-ready"],
            });

            if (!(await isCurrentHead())) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: "owner:merge-ready",
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              return;
            }

            if (!alreadyNotified) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: readyBody,
              });
            }

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - run: npm run build
        env:
          VITE_BASE: /morse-trainer/
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
