name: Format PR76 diagnostic temporary
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  generate:
    if: github.event.pull_request.number == 76
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Print formatted contents
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write "src/content/station-profile.ts" "src/data/backup.ts" "src/data/indexeddb.ts" "src/data/repository.test.ts" "src/data/repository.ts" "src/ui/screens/SettingsScreen.tsx" "src/ui/training-data-context.ts" "src/ui/training-data-context.tsx"
          for file in "src/content/station-profile.ts" "src/data/backup.ts" "src/data/indexeddb.ts" "src/data/repository.test.ts" "src/data/repository.ts" "src/ui/screens/SettingsScreen.tsx" "src/ui/training-data-context.ts" "src/ui/training-data-context.tsx"; do
            printf 'FORMAT_FILE_BEGIN:%s\n' "$file"
            base64 "$file"
            printf 'FORMAT_FILE_END:%s\n' "$file"
          done
